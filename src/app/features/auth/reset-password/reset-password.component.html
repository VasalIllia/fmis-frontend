<div class="w-100">
  <h2 class="text-center mb-4">Новий пароль</h2>
  
  <div *ngIf="errorMessage()" class="alert alert-danger p-3 mb-3 small">
    {{ errorMessage() }}
  </div>

  <div *ngIf="isSuccess()" class="alert alert-success p-3 mb-3 text-center">
    <p class="mb-3">Пароль успішно змінено.</p>
    <a class="btn btn-outline-success w-100" routerLink="/auth/login">Перейти до входу</a>
  </div>

  <form *ngIf="!isSuccess()" [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="d-flex flex-column gap-3">
    <div>
      <label class="form-label text-muted small mb-1">Email</label>
      <input class="form-control" type="email" formControlName="email" placeholder="example@mail.com" />
      <div class="text-danger small mt-1" *ngIf="resetForm.controls['email'].hasError('required') && resetForm.controls['email'].touched">Email обов'язковий</div>
      <div class="text-danger small mt-1" *ngIf="resetForm.controls['email'].hasError('email') && resetForm.controls['email'].touched">Невірний формат</div>
    </div>

    <div>
      <label class="form-label text-muted small mb-1">Код підтвердження</label>
      <input class="form-control" type="text" formControlName="resetCode" placeholder="Введіть код з пошти..." />
      <div class="text-danger small mt-1" *ngIf="resetForm.controls['resetCode'].hasError('required') && resetForm.controls['resetCode'].touched">Код підтвердження обов'язковий</div>
    </div>

    <div>
      <label class="form-label text-muted small mb-1">Новий пароль</label>
      <div class="input-group">
        <input class="form-control" [type]="hidePassword() ? 'password' : 'text'" formControlName="newPassword" />
        <button class="btn btn-outline-secondary" type="button" (click)="hidePassword.set(!hidePassword())">
          <i class="bi" [ngClass]="hidePassword() ? 'bi-eye-slash' : 'bi-eye'"></i>
        </button>
      </div>
      <div class="text-danger small mt-1" *ngIf="resetForm.controls['newPassword'].hasError('required') && resetForm.controls['newPassword'].touched">Пароль обов'язковий</div>
      <div class="text-danger small mt-1" *ngIf="resetForm.controls['newPassword'].hasError('minlength') && resetForm.controls['newPassword'].touched">Мінімум 6 символів</div>
    </div>

    <div>
      <label class="form-label text-muted small mb-1">Підтвердження пароля</label>
      <div class="input-group">
        <input class="form-control" [type]="hideConfirmPassword() ? 'password' : 'text'" formControlName="confirmPassword" />
        <button class="btn btn-outline-secondary" type="button" (click)="hideConfirmPassword.set(!hideConfirmPassword())">
          <i class="bi" [ngClass]="hideConfirmPassword() ? 'bi-eye-slash' : 'bi-eye'"></i>
        </button>
      </div>
      <div class="text-danger small mt-1" *ngIf="resetForm.hasError('mismatch') && resetForm.controls['confirmPassword'].touched">Паролі не співпадають</div>
    </div>

    <button class="btn btn-primary w-100" type="submit" [disabled]="resetForm.invalid || isLoading()">
      <span class="spinner-border spinner-border-sm me-1" *ngIf="isLoading()"></span>
      <span *ngIf="!isLoading()">Зберегти</span>
    </button>
  </form>
</div>
