<div class="w-100">
  <div *ngIf="errorMessage()" class="alert alert-danger p-3 mb-3 small">
    {{ errorMessage() }}
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="d-flex flex-column gap-3">
    <div>
      <label class="form-label text-muted small mb-1">Email</label>
      <input
        class="form-control"
        type="email"
        formControlName="email"
        placeholder="example@mail.com"
      />
      <div
        class="text-danger small mt-1"
        *ngIf="
          loginForm.controls['email'].hasError('required') && loginForm.controls['email'].touched
        "
      >
        Email обов'язковий
      </div>
      <div
        class="text-danger small mt-1"
        *ngIf="loginForm.controls['email'].hasError('email') && loginForm.controls['email'].touched"
      >
        Невірний формат
      </div>
    </div>

    <div>
      <label class="form-label text-muted small mb-1">Пароль</label>
      <div class="input-group">
        <input
          class="form-control"
          [type]="hidePassword() ? 'password' : 'text'"
          formControlName="password"
        />
        <button
          class="btn btn-outline-secondary"
          type="button"
          (click)="hidePassword.set(!hidePassword())"
        >
          <i class="bi" [ngClass]="hidePassword() ? 'bi-eye-slash' : 'bi-eye'"></i>
        </button>
      </div>
      <div
        class="text-danger small mt-1"
        *ngIf="
          loginForm.controls['password'].hasError('required') &&
          loginForm.controls['password'].touched
        "
      >
        Пароль обов'язковий
      </div>
    </div>

    <div class="d-flex justify-content-end mb-2">
      <a routerLink="/auth/forgot-password" class="text-decoration-none small text-success"
        >Забули пароль?</a
      >
    </div>

    <button
      class="btn btn-primary-custom w-100"
      type="submit"
      [disabled]="loginForm.invalid || isLoading()"
    >
      <span class="spinner-border spinner-border-sm me-1" *ngIf="isLoading()"></span>
      <span *ngIf="!isLoading()">Увійти</span>
    </button>
  </form>

  <div class="d-flex align-items-center my-4">
    <hr class="flex-grow-1" />
    <span class="px-3 text-muted small">або</span>
    <hr class="flex-grow-1" />
  </div>

  <a
    [href]="googleLoginUrl()"
    class="btn btn-outline-dark w-100 d-flex justify-content-center align-items-center gap-2"
  >
    <i class="bi bi-google text-danger"></i>
    <span>Увійти через Google</span>
  </a>
</div>
