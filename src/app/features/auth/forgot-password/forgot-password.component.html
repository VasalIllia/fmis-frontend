<div class="w-100">
  <h2 class="text-center mb-3">Відновлення пароля</h2>
  <p class="text-center text-muted mb-4 small">
    Введіть свій email, і ми надішлемо вам інструкції для відновлення пароля.
  </p>

  <div *ngIf="errorMessage()" class="alert alert-danger p-3 mb-3 small">
    {{ errorMessage() }}
  </div>

  <div *ngIf="isSuccess()" class="alert alert-success p-3 mb-3 text-center">
    <p class="mb-3">Якщо цей email існує в нашій системі, ми відправили на нього лист з інструкціями.</p>
    <a class="btn btn-outline-success w-100" routerLink="/auth/login">Повернутися до входу</a>
  </div>

  <form *ngIf="!isSuccess()" [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="d-flex flex-column gap-3">
    <div>
      <label class="form-label text-muted small mb-1">Email</label>
      <input class="form-control" type="email" formControlName="email" placeholder="example@mail.com" />
      <div class="text-danger small mt-1" *ngIf="forgotForm.controls['email'].hasError('required') && forgotForm.controls['email'].touched">Email обов'язковий</div>
      <div class="text-danger small mt-1" *ngIf="forgotForm.controls['email'].hasError('email') && forgotForm.controls['email'].touched">Невірний формат</div>
    </div>

    <button class="btn btn-primary w-100" type="submit" [disabled]="forgotForm.invalid || isLoading()">
      <span class="spinner-border spinner-border-sm me-1" *ngIf="isLoading()"></span>
      <span *ngIf="!isLoading()">Відправити</span>
    </button>
  </form>

  <p *ngIf="!isSuccess()" class="text-center mt-4 mb-0 small">
    Згадали пароль? <a routerLink="/auth/login" class="text-primary text-decoration-none">Увійти</a>
  </p>
</div>
