<div class="w-100 text-center">
  <h2 class="mb-4">Підтвердження Email</h2>
  
  <div *ngIf="isLoading()" class="d-flex justify-content-center my-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Завантаження...</span>
    </div>
  </div>

  <div *ngIf="!isLoading() && errorMessage()" class="alert alert-danger text-start">
    {{ errorMessage() }}
  </div>

  <div *ngIf="!isLoading() && isSuccess()" class="alert alert-success text-start">
    Ваш email успішно підтверджено. Тепер ви можете увійти в систему.
  </div>

  <div *ngIf="!isLoading()" class="mt-4">
    <a class="btn btn-primary w-100" routerLink="/auth/login">Перейти до входу</a>
  </div>
</div>
