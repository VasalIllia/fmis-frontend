<div class="modal-content shadow-lg border-0 rounded-3">
  <div class="modal-header">
    <h4 class="modal-title pull-left">Зміна пароля</h4>
    <button
      type="button"
      class="btn-close close pull-right"
      aria-label="Close"
      (click)="dialogRef.close()"
    >
      <span aria-hidden="true" class="visually-hidden">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <div *ngIf="errorMessage()" class="alert alert-danger mb-3">
      {{ errorMessage() }}
    </div>

    <form [formGroup]="passwordForm">
      <div class="mb-3">
        <label class="form-label">Поточний пароль</label>
        <div class="input-group">
          <input
            class="form-control"
            [type]="hideOld() ? 'password' : 'text'"
            formControlName="oldPassword"
          />
          <button class="btn btn-outline-secondary" type="button" (click)="hideOld.set(!hideOld())">
            <i class="bi" [ngClass]="hideOld() ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
        <div
          class="text-danger small mt-1"
          *ngIf="
            passwordForm.controls['oldPassword'].hasError('required') &&
            passwordForm.controls['oldPassword'].touched
          "
        >
          Обов'язкове поле
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Новий пароль</label>
        <div class="input-group">
          <input
            class="form-control"
            [type]="hideNew() ? 'password' : 'text'"
            formControlName="newPassword"
          />
          <button class="btn btn-outline-secondary" type="button" (click)="hideNew.set(!hideNew())">
            <i class="bi" [ngClass]="hideNew() ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
        <div
          class="text-danger small mt-1"
          *ngIf="
            passwordForm.controls['newPassword'].hasError('required') &&
            passwordForm.controls['newPassword'].touched
          "
        >
          Обов'язкове поле
        </div>
        <div
          class="text-danger small mt-1"
          *ngIf="
            passwordForm.controls['newPassword'].hasError('minlength') &&
            passwordForm.controls['newPassword'].touched
          "
        >
          Мінімум 6 символів
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Підтвердження нового пароля</label>
        <div class="input-group">
          <input
            class="form-control"
            [type]="hideConfirm() ? 'password' : 'text'"
            formControlName="confirmPassword"
          />
          <button
            class="btn btn-outline-secondary"
            type="button"
            (click)="hideConfirm.set(!hideConfirm())"
          >
            <i class="bi" [ngClass]="hideConfirm() ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
        <div
          class="text-danger small mt-1"
          *ngIf="
            passwordForm.hasError('mismatch') && passwordForm.controls['confirmPassword'].touched
          "
        >
          Паролі не співпадають
        </div>
      </div>
    </form>
  </div>
  <div class="modal-footer border-0">
    <button
      type="button"
      class="btn btn-outline-secondary"
      (click)="dialogRef.close()"
      [disabled]="isLoading()"
    >
      Скасувати
    </button>
    <button
      type="button"
      class="btn btn-primary text-white"
      (click)="onSubmit()"
      [disabled]="passwordForm.invalid || isLoading()"
    >
      <span class="spinner-border spinner-border-sm me-1" *ngIf="isLoading()"></span>
      Зберегти
    </button>
  </div>
</div>
