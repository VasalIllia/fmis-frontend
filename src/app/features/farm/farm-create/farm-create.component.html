<div class="d-flex justify-content-center align-items-center min-vh-100 bg-light p-3">
  <div class="card card-custom w-100" style="max-width: 450px">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <h2 class="fw-bold text-dark mb-2">Вітаємо у Farma!</h2>
        <p class="text-secondary-custom small">Створіть свою першу ферму, щоб почати роботу.</p>
      </div>

      <div *ngIf="errorMessage()" class="alert alert-danger p-3 mb-3 small">
        {{ errorMessage() }}
      </div>

      <form [formGroup]="farmForm" (ngSubmit)="onSubmit()" class="d-flex flex-column gap-3">
        <div>
          <label class="form-label text-secondary-custom small mb-1">Назва ферми</label>
          <input class="form-control" formControlName="name" placeholder="Моя ферма" />
          <div
            class="text-danger-custom small mt-1"
            *ngIf="
              farmForm.controls['name'].hasError('required') && farmForm.controls['name'].touched
            "
          >
            Назва обов'язкова
          </div>
        </div>

        <button
          class="btn btn-primary-custom w-100 mt-2"
          type="submit"
          [disabled]="farmForm.invalid || isLoading()"
        >
          <span class="spinner-border spinner-border-sm me-1" *ngIf="isLoading()"></span>
          <span *ngIf="!isLoading()">Створити ферму</span>
        </button>
      </form>
    </div>
  </div>
</div>
