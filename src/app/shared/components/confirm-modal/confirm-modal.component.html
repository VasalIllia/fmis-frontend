<div
  *ngIf="isOpen"
  class="modal fade show d-block"
  tabindex="-1"
  role="dialog"
  aria-modal="true"
  style="background: rgba(34, 48, 37, 0.45); backdrop-filter: blur(4px); z-index: 1060;"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <header class="modal-header border-bottom" [ngClass]="headerClass">
        <h5 class="modal-title fw-bold">{{ title }}</h5>
        <button type="button" class="btn-close btn-close-white" (click)="onCancel()" [disabled]="submitting"></button>
      </header>
      <div class="modal-body py-4">
        <p class="mb-0 text-dark" [innerHTML]="message"></p>
        <span *ngIf="warning" class="text-danger d-block mt-2 fw-medium">{{ warning }}</span>
        <div
          *ngIf="alertMessage"
          class="alert alert-warning border-0 py-2 mt-3 mb-0"
          role="alert"
          style="font-size: 0.85rem;"
        >
          <i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>
          <span [innerHTML]="alertMessage"></span>
        </div>
      </div>
      <footer class="modal-footer border-top">
        <button type="button" class="btn btn-outline-secondary" (click)="onCancel()" [disabled]="submitting">
          Скасувати
        </button>
        <button
          type="button"
          class="btn d-flex align-items-center gap-2"
          [ngClass]="confirmClass"
          (click)="onConfirm()"
          [disabled]="submitting"
        >
          <span *ngIf="submitting" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          {{ confirmText }}
        </button>
      </footer>
    </div>
  </div>
</div>
