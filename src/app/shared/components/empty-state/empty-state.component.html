<section class="text-center py-5 bg-white rounded-3 border" aria-label="Порожній стан">
  <i class="bi {{ icon }} text-muted" style="font-size: 3.5rem;"></i>
  <h4 class="mt-3 text-dark fw-bold">{{ title }}</h4>
  <p class="text-muted max-width-md mx-auto">{{ message }}</p>
  <button
    *ngIf="actionLabel"
    class="btn btn-primary-custom mt-2"
    (click)="onAction()"
  >
    <i class="bi bi-plus-lg"></i> {{ actionLabel }}
  </button>
</section>
